<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;700&amp;display=swap');
      .logo-mark {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 200;
        font-size: 32px;
        letter-spacing: 9px;
        fill: #1B1D1F;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .logo-sub {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 3.2px;
        fill: #5A5D61;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- MIRKAZEMI (Offset to account for tracking) -->
  <text x="244.5" y="48" class="logo-mark">MIRKAZEMI</text>

  <!-- CONSTRUCTION GROUP -->
  <text x="241.6" y="82" class="logo-sub">CONSTRUCTION GROUP</text>
</svg>
