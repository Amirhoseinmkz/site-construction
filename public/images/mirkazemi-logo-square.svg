<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;700&amp;display=swap');
      .logo-mark {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 200;
        font-size: 40px;
        letter-spacing: 12px;
        fill: #1B1D1F;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .logo-sub {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 4px;
        fill: #5A5D61;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .logo-divider {
        stroke: #DDA13B;
        stroke-width: 2;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Centered Square Composition -->
  <g transform="translate(0, 0)">
    <!-- MIRKAZEMI (Offset to account for tracking) -->
    <text x="306" y="280" class="logo-mark">MIRKAZEMI</text>

    <!-- Subtle Architectural Divider Line -->
    <line x1="250" y1="306" x2="350" y2="306" class="logo-divider" />

    <!-- CONSTRUCTION GROUP -->
    <text x="302" y="332" class="logo-sub">CONSTRUCTION GROUP</text>
  </g>
</svg>
